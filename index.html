<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイック席替えメーカー</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @media print {
            @page { margin: 1cm; size: landscape; }
            body { -webkit-print-color-adjust: exact; }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-stone-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Replaced lucide-react with inline SVGs for standalone HTML) ---
        const IconBase = ({ size = 24, children, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const GridIcon = (props) => (
            <IconBase {...props}>
                <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/>
            </IconBase>
        );
        const UsersIcon = (props) => (
            <IconBase {...props}>
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </IconBase>
        );
        const ShuffleIcon = (props) => (
            <IconBase {...props}>
                <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l14.2-12.6"/><path d="M22 18h-1.4c-1.3 0-2.5-.6-3.3-1.7L3.1 3.7"/><path d="M16 22h6v-6"/><path d="M16 2h6v6"/>
            </IconBase>
        );
        const MoveIcon = (props) => (
            <IconBase {...props}>
                <polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/>
            </IconBase>
        );
        const RefreshCwIcon = (props) => (
            <IconBase {...props}>
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
            </IconBase>
        );
        const PrinterIcon = (props) => (
            <IconBase {...props}>
                <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>
            </IconBase>
        );


        // --- Main Application ---
        function App() {
            // --- State Definitions ---
            const defaultNames = "佐藤, 鈴木, 高橋, 田中, 伊藤, 渡辺, 山本, 中村, 小林, 加藤, 吉田, 山田, 佐々木, 山口, 松本, 井上, 木村, 林, 斎藤, 清水, 山崎, 森, 池田, 橋本, 阿部, 石川, 山下, 中島, 石井, 小川, 前田, 岡田, 長谷川, 藤田, 後藤, 近藤";
            
            const [inputNames, setInputNames] = useState(defaultNames);
            const [rows, setRows] = useState(6);
            const [cols, setCols] = useState(6);
            const [seats, setSeats] = useState([]);
            const [selectedSeatIndex, setSelectedSeatIndex] = useState(null);
            const [isEditMode, setIsEditMode] = useState(true); // Toggle between input and view
            const [message, setMessage] = useState("");

            // --- Logic ---

            // Generate the seating chart
            const generateSeats = () => {
                // 1. Parse names
                const nameList = inputNames
                .split(/[,、\n]/) // Split by comma, Japanese comma, or newline
                .map(name => name.trim())
                .filter(name => name !== "");

                // 2. Create slots based on layout
                const totalSlots = rows * cols;
                let newSeats = [...nameList];

                // Shuffle names using Fisher-Yates algorithm
                for (let i = newSeats.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newSeats[i], newSeats[j]] = [newSeats[j], newSeats[i]];
                }

                // Fill remaining slots with empty strings if fewer students than seats
                if (newSeats.length < totalSlots) {
                const emptySlots = Array(totalSlots - newSeats.length).fill(null);
                newSeats = [...newSeats, ...emptySlots];
                } else {
                // If more students than seats, cut off (or handled by UI logic)
                newSeats = newSeats.slice(0, totalSlots);
                }

                setSeats(newSeats);
                setIsEditMode(false); // Switch to view mode
                setSelectedSeatIndex(null);
                showMessage("席替え完了！");
            };

            // Swap functionality for manual adjustments (Vision/Compatibility)
            const handleSeatClick = (index) => {
                if (selectedSeatIndex === null) {
                // Select first seat
                setSelectedSeatIndex(index);
                } else {
                // Select second seat and swap
                if (selectedSeatIndex !== index) {
                    const newSeats = [...seats];
                    [newSeats[selectedSeatIndex], newSeats[index]] = [newSeats[index], newSeats[selectedSeatIndex]];
                    setSeats(newSeats);
                    showMessage("席を入れ替えました");
                }
                setSelectedSeatIndex(null);
                }
            };

            const showMessage = (msg) => {
                setMessage(msg);
                setTimeout(() => setMessage(""), 2000);
            };

            const handlePrint = () => {
                window.print();
            };

            // --- Render Helpers ---
            const gridStyle = {
                display: 'grid',
                gridTemplateColumns: `repeat(${cols}, 1fr)`,
                gap: '0.75rem',
            };

            return (
                <div className="min-h-screen bg-stone-100 font-sans text-stone-800 pb-12 print:bg-white print:pb-0">
                
                {/* Toast Notification */}
                {message && (
                    <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white px-6 py-3 rounded-full shadow-lg z-50 animate-bounce print:hidden">
                    {message}
                    </div>
                )}

                {/* Header - Hidden on Print */}
                <header className="bg-white shadow-sm border-b border-stone-200 print:hidden">
                    <div className="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <div className="bg-indigo-600 p-2 rounded-lg text-white">
                        <GridIcon size={24} />
                        </div>
                        <h1 className="text-xl font-bold text-stone-800">クイック席替えメーカー</h1>
                    </div>
                    <button 
                        onClick={() => setIsEditMode(!isEditMode)}
                        className="text-sm text-indigo-600 font-medium hover:underline flex items-center gap-1"
                    >
                        {isEditMode ? "プレビューへ" : "設定に戻る"}
                    </button>
                    </div>
                </header>

                <main className="max-w-5xl mx-auto px-4 py-6">
                    
                    {/* --- SETTINGS AREA (Input) --- */}
                    <div className={`bg-white rounded-xl shadow-md p-6 mb-8 transition-all duration-300 print:hidden ${isEditMode ? 'block' : 'hidden'}`}>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        
                        {/* Left: Settings */}
                        <div className="space-y-6">
                        <div>
                            <label className="flex items-center gap-2 text-sm font-bold text-stone-600 mb-2">
                            <GridIcon size={18} />
                            教室のレイアウト
                            </label>
                            <div className="flex items-center gap-4">
                            <div className="flex-1">
                                <span className="text-xs text-stone-500 block mb-1">横（列）</span>
                                <input 
                                type="number" 
                                min="1" max="10" 
                                value={cols}
                                onChange={(e) => setCols(Number(e.target.value))}
                                className="w-full p-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                                />
                            </div>
                            <span className="text-stone-400">×</span>
                            <div className="flex-1">
                                <span className="text-xs text-stone-500 block mb-1">縦（行）</span>
                                <input 
                                type="number" 
                                min="1" max="10" 
                                value={rows}
                                onChange={(e) => setRows(Number(e.target.value))}
                                className="w-full p-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                                />
                            </div>
                            </div>
                        </div>

                        <div>
                            <label className="flex items-center gap-2 text-sm font-bold text-stone-600 mb-2">
                            <UsersIcon size={18} />
                            児童・生徒の名前
                            </label>
                            <p className="text-xs text-stone-500 mb-2">カンマ(,) または 改行で区切ってください</p>
                            <textarea 
                            value={inputNames}
                            onChange={(e) => setInputNames(e.target.value)}
                            className="w-full h-40 p-3 border border-stone-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none"
                            placeholder="佐藤, 鈴木, 高橋..."
                            ></textarea>
                            <div className="text-right text-xs text-stone-400 mt-1">
                            現在: {inputNames.split(/[,、\n]/).filter(n => n.trim()).length} 名
                            </div>
                        </div>

                        <button 
                            onClick={generateSeats}
                            className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-md font-bold text-lg flex items-center justify-center gap-2 transition-transform active:scale-95"
                        >
                            <ShuffleIcon size={20} />
                            席替えを実行する
                        </button>
                        </div>

                        {/* Right: Instructions */}
                        <div className="bg-stone-50 rounded-lg p-6 border border-stone-100">
                        <h3 className="font-bold text-stone-700 mb-4">使い方ガイド</h3>
                        <ul className="space-y-3 text-sm text-stone-600">
                            <li className="flex items-start gap-2">
                            <span className="bg-indigo-100 text-indigo-700 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">1</span>
                            <span>名前を一括入力エリアに貼り付けます（Excel等からコピー可）。</span>
                            </li>
                            <li className="flex items-start gap-2">
                            <span className="bg-indigo-100 text-indigo-700 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">2</span>
                            <span>縦・横の人数を設定し「席替えを実行」をクリック。</span>
                            </li>
                            <li className="flex items-start gap-2">
                            <span className="bg-indigo-100 text-indigo-700 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">3</span>
                            <span><strong>配慮事項の調整：</strong> 生成された席をクリックして選択し、別の席をクリックすると入れ替わります。</span>
                            </li>
                            <li className="flex items-start gap-2">
                            <span className="bg-indigo-100 text-indigo-700 rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">4</span>
                            <span>調整が完了したら右下の印刷ボタンでPDF保存または印刷します。</span>
                            </li>
                        </ul>
                        </div>

                    </div>
                    </div>

                    {/* --- RESULTS AREA (Seating Chart) --- */}
                    {seats.length > 0 && (
                    <div className="animate-fade-in-up">
                        
                        {/* Blackboard / Front of class */}
                        <div className="mb-8 text-center print:mb-4">
                        <div className="inline-block bg-emerald-800 text-white px-12 py-2 rounded-sm shadow-md border-4 border-amber-700 print:bg-transparent print:text-black print:border-none print:shadow-none print:p-0 print:border-b-2 print:border-black print:w-full">
                            <h2 className="text-lg font-bold tracking-widest print:text-2xl">教卓 / 黒板</h2>
                        </div>
                        </div>

                        {/* The Grid */}
                        <div 
                        style={gridStyle} 
                        className="w-full max-w-4xl mx-auto"
                        >
                        {seats.map((student, index) => {
                            const isSelected = selectedSeatIndex === index;
                            const isEmpty = student === null;

                            return (
                            <div 
                                key={index}
                                onClick={() => !isEditMode && handleSeatClick(index)}
                                className={`
                                relative aspect-[4/3] flex items-center justify-center rounded-lg shadow-sm border-2 transition-all cursor-pointer select-none
                                print:shadow-none print:border print:border-black print:rounded-none
                                ${isEmpty 
                                    ? 'bg-stone-100 border-dashed border-stone-300 print:hidden' 
                                    : 'bg-white border-stone-200 hover:border-indigo-400 hover:shadow-md'
                                }
                                ${isSelected ? 'ring-4 ring-indigo-500 border-indigo-500 transform scale-105 z-10 bg-indigo-50' : ''}
                                `}
                            >
                                {/* Desk visual (simple line at top) - hidden on print to save ink */}
                                {!isEmpty && (
                                <div className="absolute top-2 w-1/2 h-1 bg-stone-200 rounded-full print:hidden"></div>
                                )}

                                <span className={`font-bold text-stone-800 text-center px-1 break-words line-clamp-2 print:text-black print:text-lg ${student && student.length > 5 ? 'text-sm' : 'text-lg'}`}>
                                {student}
                                </span>

                                {/* Swap Indicator */}
                                {isSelected && (
                                <div className="absolute -top-3 -right-3 bg-indigo-600 text-white rounded-full p-1 shadow-lg print:hidden">
                                    <MoveIcon size={14} />
                                </div>
                                )}
                            </div>
                            );
                        })}
                        </div>

                        {/* Bottom Controls (Only visible in View Mode, Hidden on Print) */}
                        <div className={`mt-12 flex justify-center gap-4 print:hidden ${isEditMode ? 'hidden' : 'flex'}`}>
                        <button 
                            onClick={() => setIsEditMode(true)}
                            className="px-6 py-3 bg-white border border-stone-300 text-stone-700 rounded-full shadow-sm hover:bg-stone-50 font-bold flex items-center gap-2"
                        >
                            <RefreshCwIcon size={18} />
                            やり直す
                        </button>
                        
                        <button 
                            onClick={handlePrint}
                            className="px-8 py-3 bg-indigo-600 text-white rounded-full shadow-lg hover:bg-indigo-700 font-bold flex items-center gap-2 transform hover:-translate-y-1 transition-all"
                        >
                            <PrinterIcon size={20} />
                            印刷 / PDF保存
                        </button>
                        </div>

                        {/* Print Footer */}
                        <div className="hidden print:block text-center mt-8 text-sm text-gray-500">
                        作成日: {new Date().toLocaleDateString('ja-JP')}
                        </div>
                        
                    </div>
                    )}
                </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
